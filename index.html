<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="google" content="notranslate">
<title>WORLD TAP - Swat - Final Pro</title>
<script src="https://accounts.google.com/gsi/client" async></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{background:#000;color:#fff;font-family:system-ui,Arial;height:100vh;overflow:hidden}
.top{position:fixed;top:0;left:0;right:0;z-index:1000;background:#000;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid #1a1a1a}
.logo{font-weight:900;font-size:17px}.logo span{font-size:7px;color:#888;display:block;letter-spacing:1px;margin-top:2px}
.main{position:fixed;top:56px;left:0;right:0;bottom:72px;overflow:hidden}
.page{position:absolute;top:0;left:0;right:0;bottom:0;background:#000;display:none;overflow:auto}
.page.active{display:block}
#page-map.active{display:flex;flex-direction:column}
.map-area{flex:1;background:radial-gradient(circle at 50% 40%, #1a1a1a 0%, #000 70%);position:relative;overflow:hidden}
.dot{position:absolute;width:16px;height:16px;background:#fff;border-radius:50%;border:3px solid #000;box-shadow:0 0 15px #fff;animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,0.8)}70%{box-shadow:0 0 0 12px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
.card{position:absolute;bottom:12px;left:10px;right:10px;background:rgba(20,20,20,0.96);backdrop-filter:blur(20px);border:1px solid #333;border-radius:18px;padding:12px;z-index:20;display:none}
.card.show{display:block}
.bottom{position:fixed;bottom:0;left:0;right:0;height:72px;background:#000;border-top:1px solid #222;display:flex;align-items:center;z-index:99999;padding:0 4px}
.btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#666}
.btn.active{color:#fff}
.btn .ic{font-size:22px}.btn .tx{font-size:8px;font-weight:800;margin-top:3px}
.btn-up{flex:1;display:flex;justify-content:center}
.btn-up div{background:#fff;color:#000;width:48px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900}
.short{height:100%;position:relative;scroll-snap-align:start;background:#000}
.short img,.short video{width:100%;height:100%;object-fit:cover}
.short-ui{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,0.85));padding:20px 12px 12px 12px}
.modal{position:fixed;top:0;left:0;right:0;bottom:0;background:#000;z-index:100000;display:none;overflow:auto}
.modal.show{display:block}
.inp{width:100%;background:#111;border:1px solid #222;border-radius:12px;padding:14px;color:#fff;margin-top:12px;font-size:14px}
.set-row{display:flex;justify-content:space-between;align-items:center;padding:18px 15px;border-bottom:1px solid #111}
.set-row:active{background:#111}
</style>
</head>
<body>

</div>
