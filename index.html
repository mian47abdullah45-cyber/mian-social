<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="google" content="notranslate">
<title>WORLD TAP - Swat</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{background:#000;color:#fff;font-family:system-ui,Arial;height:100vh;overflow:hidden}
.top{position:fixed;top:0;left:0;right:0;z-index:1000;background:rgba(0,0,0,0.9);backdrop-filter:blur(20px);height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 15px;border-bottom:1px solid #1a1a1a}
.logo{font-weight:900;font-size:17px}.logo span{font-size:7px;color:#888;display:block;letter-spacing:1px}
.main{position:fixed;top:56px;left:0;right:0;bottom:75px;overflow:hidden}
.page{position:absolute;top:0;left:0;right:0;bottom:0;background:#000;display:none;overflow:auto}
.page.active{display:block}
#page-map.active{display:flex;flex-direction:column}
.map-area{flex:1;background:radial-gradient(circle at 50% 30%, #1a1a1a, #000);position:relative}
.tap-dot{position:absolute;width:16px;height:16px;background:#fff;border-radius:50%;border:3px solid #000;box-shadow:0 0 20px #fff;animation:pulse 2s infinite;cursor:pointer}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,0.8)}70%{box-shadow:0 0 0 12px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
.card{position:absolute;bottom:15px;left:10px;right:10px;background:rgba(20,20,20,0.95);backdrop-filter:blur(20px);border:1px solid #333;border-radius:20px;padding:14px;z-index:50;display:none}
.card.show{display:block}
.bottom{position:fixed;bottom:0;left:0;right:0;height:75px;background:rgba(0,0,0,0.98);border-top:1px solid #222;display:flex;align-items:center;padding:0 5px;z-index:9999}
.btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#666;padding:8px}
.btn.active{color:#fff}
.btn .ic{font-size:23px}.btn .tx{font-size:8px;font-weight:800;margin-top:3px;letter-spacing:0.6px}
.btn-upload{flex:1;display:flex;align-items:center;justify-content:center}
.btn-upload div{background:#fff;color:#000;width:52px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;box-shadow:0 0 20px rgba(255,255,255,0.2)}
.short-item{height:100%;position:relative;scroll-snap-align:start;background:#000}
.short-item video,.short-item img{width:100%;height:100%;object-fit:cover}
.short-ui{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,0.9));padding:25px 15px 15px 15px}
.upload-modal{position:fixed;top:0;left:0;right:0;bottom:0;background:#000;z-index:10000;display:none;overflow:auto}
.upload-modal.show{display:block}
.input{width:100%;background:#111;border:1px solid #222;border-radius:12px;padding:14px;color:#fff;font-size:14px;margin-top:10px}
.settings-item{display:flex;justify-content:space-between;align-items:center;padding:18px 15px;border-bottom:1px solid #111;background:#000}
.settings-item:active{background:#111}
</style>
</head>
