<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MIAN SHOSAL - Reels</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:system-ui;overflow:hidden}
.header{position:fixed;top:0;left:0;right:0;z-index:100;background:linear-gradient(180deg,rgba(0,0,0,.8),transparent);padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:900;font-size:18px} .logo span{color:#FFD60A}
.reels{height:100vh;overflow-y:scroll;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch}
.reel{height:100vh;width:100%;position:relative;scroll-snap-align:start;background:#111;display:flex;align-items:center;justify-content:center;overflow:hidden}
.reel img,.reel video{width:100%;height:100%;object-fit:cover}
.overlay{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(0deg,rgba(0,0,0,.9),transparent);padding:20px 16px 90px 16px}
.user{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#7C3AED,#FFD60A);display:flex;align-items:center;justify-content:center;font-weight:900;border:2px solid #fff}
.right{position:absolute;right:12px;bottom:100px;display:flex;flex-direction:column;gap:20px;align-items:center}
.icon{width:50px;height:50px;background:rgba(255,255,255,.1);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2)}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#000;border-top:1px solid #222;display:flex;justify-content:space-around;padding:10px 0;z-index:100}
.b{opacity:.6;text-align:center;font-size:10px} .b.active{opacity:1;color:#FFD60A} .b div{font-size:22px}
.upload{position:fixed;bottom:80px;right:16px;width:60px;height:60px;background:linear-gradient(135deg,#7C3AED,#FFD60A);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;z-index:90;box-shadow:0 4px 20px rgba(124,58,237,.5)}
</style>
</head>
<body>

<div class="header">
<div class="logo">MIAN <span>SHOSAL</span> MGA</div>
<div style="display:flex;gap:12px;align-items:center"><span>🔍</span><span>💰 <span id="coins">0</span></span></div>
</div>

<div class="reels" id="reels">
<!-- Reels will come here -->
</div>

<div class="upload" onclick="document.getElementById('file').click()">+</div>
<input type="file" id="file" accept="image/*,video/*" style="display:none" onchange="addReel(this)">

<div class="bottom">
<div class="b active"><div>🏠</div>Home</div>
<div class="b"><div>🔍</div>Search</div>
<div class="b"><div>🎬</div>Reels</div>
<div class="b"><div>💰</div>Earn</div>
<div class="b"><div>👤</div>You</div>
</div>

<script>
let coins = parseInt(localStorage.getItem('mian_coins')||'0');
document.getElementById('coins').innerText=coins;
let reelsData = JSON.parse(localStorage.getItem('mga_reels')||'[]');

// Default 3 reels agar koi nahi
if(reelsData.length==0){
  reelsData=[
    {text:'Welcome to MIAN SHOSAL MGA! 🔥\nTikdarai, Swat se puri duniya tak!', img:'https://picsum.photos/seed/mga1/720/1280', likes:1250},
    {text:'Mian Abdullah Gulzar ka app! 🇵🇰\nAb Insta jaisa scroll karo!', img:'https://picsum.photos/seed/mga2/720/1280', likes:890},
    {text:'Photo/Video upload karo + button se!\nPaisa kamao! 💰', img:'https://picsum.photos/seed/mga3/720/1280', likes:2100},
  ];
}

function render(){
  let r=document.getElementById('reels'); r.innerHTML='';
  reelsData.slice().reverse().forEach((item,i)=>{
    let isVideo = item.img && item.img.startsWith('data:video');
    let media = isVideo ? `<video src="${item.img}" loop autoplay muted playsinline style="width:100%;height:100%;object-fit:cover"></video>` : `<img src="${item.img}">`;
    r.innerHTML+=`
    <div class="reel">
      ${media}
      <div class="overlay">
        <div class="user"><div class="avatar">M</div><div><b>Mian Abdullah • MGA</b> <span style="background:#FFD60A;color:#000;padding:2px 6px;border-radius:10px;font-size:10px;margin-left:6px">FOLLOW</span><div style="font-size:13px;margin-top:4px">${item.text}</div></div></div>
        <div style="font-size:12px;opacity:.8">🎵 Original Audio • MGA • Tikdarai Swat</div>
      </div>
      <div class="right">
        <div class="icon" onclick="like(this)">❤️<br><span style="font-size:10px">${item.likes}</span></div>
        <div class="icon">💬<br><span style="font-size:10px">45</span></div>
        <div class="icon">↗️<br><span style="font-size:10px">Share</span></div>
        <div class="icon">💰</div>
        <div class="avatar" style="width:50px;height:50px">M</div>
      </div>
    </div>`;
  });
}

function addReel(input){
  let file=input.files[0]; if(!file) return;
  let reader=new FileReader();
  reader.onload=e=>{
    reelsData.push({text:'Mian ka naya Reel! 🔥 #MGA #Swat #Pakistan', img:e.target.result, likes: Math.floor(Math.random()*500)+1});
    localStorage.setItem('mga_reels', JSON.stringify(reelsData));
    coins+=100; localStorage.setItem('mian_coins',coins); document.getElementById('coins').innerText=coins;
    render();
    alert('Reel upload ho gaya! +100 Coins! 🎉\nAb neeche scroll karo - Insta jaisa!');
  };
  reader.readAsDataURL(file);
}

function like(el){
  let count=parseInt(el.innerText.match(/\d+/)[0])+1;
  el.innerHTML=`❤️<br><span style="font-size:10px">${count}</span>`;
  coins+=5; localStorage.setItem('mian_coins',coins); document.getElementById('coins').innerText=coins;
}

render();
</script>
</body>
</html>
