.post{background:#15151f;margin:12px;border-radius:16px;padding:14px;border:1px solid #222232}

.stat{display:flex;justify-content:space-around;text-align:center;padding:12px 0}

.lang-btn{background:#1e1e2e;border:1px solid #FFD60A;padding:6px 12px;border-radius:20px;font-size:11px;color:#FFD60A;font-weight:800}
.lang-sheet{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.85);z-index:500;display:none;align-items:end}
.lang-sheet.show{display:flex}
.lang-list{background:#15151f;width:100%;max-height:85vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px}
