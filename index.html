<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Tap - Swat</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Arial;overflow:hidden}
#map{height:100vh;width:100vw;z-index:1;filter:invert(1) hue-rotate(180deg) brightness(0.8) contrast(1.2);}
.top-bar{position:fixed;top:0;left:0;right:0;z-index:999;background:rgba(0,0,0,0.9);padding:12px 15px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222}
.logo{font-weight:900;font-size:22px;line-height:1}
.logo span{display:block;font-size:9px;font-weight:400;letter-spacing:1px;color:#888;margin-top:2px}
.creator-badge{position:fixed;bottom:75px;left:10px;z-index:999;background:rgba(255,255,255,0.1);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.2);padding:6px 12px;border-radius:20px;font-size:10px;color:#aaa}
.tap-card{position:fixed;bottom:105px;left:10px;right:10px;z-index:1000;background:#111;border:1px solid #333;border-radius:20px;padding:15px;display:none;max-height:70vh;overflow:auto}
.tap-card.show{display:block}
.tap-img{width:100%;height:180px;object-fit:cover;border-radius:15px;background:#222}
.chat-box{margin-top:12px;background:#000;border-radius:12px;padding:10px;max-height:120px;overflow-y:auto}
.chat-msg{font-size:12px;margin-bottom:6px;padding:6px 8px;background:#111;border-radius:8px}
.country-tag{display:inline-block;background:#fff;color:#000;padding:3px 8px;border-radius:10px;font-size:10px;font-weight:bold;margin-bottom:8px}
.upload-btn{position:fixed;bottom:160px;right:20px;z-index:999;background:#fff;color:#000;width:60px;height:60px;border-radius:50%;border:none;font-size:28px;font-weight:bold}
input.chat-input{width:100%;margin-top:8px;padding:10px;border-radius:20px;border:1px solid #333;background:#111;color:#fff}
</style>
</head>
<body>
<div class="top-bar">
<div class="logo">WORLD TAP <span>Sode Pede Main Abdullah Gulzar • Swat ❤️</span></div>
<div class="live-count" style="background:#fff;color:#000;padding:5px 12px;border-radius:20px;font-size:11px;font-weight:bold">● <span id="liveNum">2,104</span> LIVE</div>
</div>
<div id="map"></div>
<div class="creator-badge">🏔️ Swat Valley - Abdullah Gulzar</div>
<button class="upload-btn" onclick="uploadTap()">+</button>

<div class="tap-card" id="tapCard">
<span class="country-tag" id="countryTag">🇵🇰 PAKISTAN CHAT</span>
<img id="tapImg" class="tap-img" src="">
<div style="display:flex;justify-content:space-between;margin-top:10px"><div><div style="font-weight:bold" id="tapPlace">Swat, Pakistan</div><div style="font-size:11px;color:#888" id="tapTime">Just now</div></div><button id="heartBtn" style="background:transparent;border:none;font-size:26px;color:#444" onclick="likeTap()">♥</button></div>

<div class="chat-box" id="chatBox">
<div class="chat-msg"><b>Ali - Swat:</b> Sode pede, Swat se kon kon hai? 🏔️</div>
<div class="chat-msg"><b>Ayesha - PK:</b> World Tap best app hai!</div>
</div>
<input class="chat-input" id="chatInput" placeholder="Type message for this country..." onkeypress="if(event.key==='Enter')sendMsg()">

<div style="display:flex;gap:8px;margin-top:10px"><button style="flex:1;padding:12px;border-radius:25px;border:none;font-weight:bold;background:#fff;color:#000" onclick="sendMsg()">SEND TO 🇵🇰</button><button style="flex:1;padding:12px;border-radius:25px;border:1px solid #444;background:#222;color:#fff" onclick="nextTap()">NEXT COUNTRY →</button></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
var map = L.map('map', {zoomControl:false, minZoom:2}).setView([34.8, 72.3], 7);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19}).addTo(map);

var currentCountry="Pakistan";
var countryChats={
"Pakistan":[{user:"Ali - Swat",msg:"Sode pede, Swat se kon kon hai? 🏔️"},{user:"Ayesha - PK",msg:"World Tap best app hai!"}],
"India":[{user:"Rahul - Delhi",msg:"Hello from India! 🇮🇳"}],
"USA":[{user:"John - NY",msg:"Hey from USA! 🇺🇸"}],
"UK":[{user:"Emma - London",msg:"Hello UK here! 🇬🇧"}],
"Japan":[{user:"Yuki - Tokyo",msg:"Konnichiwa! 🇯🇵"}]
};

var taps=[
{lat:34.8,lng:72.35,place:"Swat, Pakistan",country:"Pakistan",flag:"🇵🇰",img:"https://picsum.photos/500/300?random=1",time:"2 sec ago"},
{lat:33.7,lng:73.1,place:"Islamabad, Pakistan",country:"Pakistan",flag:"🇵🇰",img:"https://picsum.photos/500/300?random=2",time:"5 sec ago"},
{lat:40.7,lng:-74,place:"New York, USA",country:"USA",flag:"🇺🇸",img:"https://picsum.photos/500/300?random=3",time:"3 sec ago"},
{lat:28.6,lng:77.2,place:"Delhi, India",country:"India",flag:"🇮🇳",img:"https://picsum.photos/500/300?random=4",time:"7 sec ago"},
{lat:51.5,lng:-0.12,place:"London, UK",country:"UK",flag:"🇬🇧",img:"https://picsum.photos/500/300?random=5",time:"9 sec ago"},
{lat:35.6,lng:139.6,place:"Tokyo, Japan",country:"Japan",flag:"🇯🇵",img:"https://picsum.photos/500/300?random=6",time:"12 sec ago"}
];

function getCountryFromLatLng(lat,lng){
if(lat>23 && lat<38 && lng>60 && lng<80) return {country:"Pakistan",flag:"🇵🇰"};
if(lat>8 && lat<36 && lng>68 && lng<98) return {country:"India",flag:"🇮🇳"};
if(lat>24 && lat<50 && lng>-130 && lng<-60) return {country:"USA",flag:"🇺🇸"};
if(lat>49 && lat<60 && lng>-8 && lng<2) return {country:"UK",flag:"🇬🇧"};
if(lat>30 && lat<46 && lng>129 && lng<146) return {country:"Japan",flag:"🇯🇵"};
return {country:"World",flag:"🌍"};
}

function showRandomTap(latlng){
var t;
if(latlng){var c=getCountryFromLatLng(latlng.lat,latlng.lng); t={lat:latlng.lat,lng:latlng.lng,place:"Near "+c.country,country:c.country,flag:c.flag,img:"https://picsum.photos/500/300?random="+Math.floor(Math.random()*100),time:"Just now"}; }
else{t=taps[Math.floor(Math.random()*taps.length)];}
currentCountry=t.country;
document.getElementById('tapImg').src=t.img;
document.getElementById('tapPlace').innerText=t.place;
document.getElementById('tapTime').innerText=t.time;
document.getElementById('countryTag').innerText=t.flag+" "+t.country.toUpperCase()+" CHAT";
loadChat(t.country);
document.getElementById('tapCard').classList.add('show');
}

function loadChat(country){
var box=document.getElementById('chatBox');
box.innerHTML="";
var chats=countryChats[country] || [{user:"System",msg:"Be first to chat in "+country+"! "+ (country=="Pakistan"?"Sode Pede!":"")}];
chats.forEach(c=>{box.innerHTML+=`<div class="chat-msg"><b>${c.user}:</b> ${c.msg}</div>`;});
box.scrollTop=box.scrollHeight;
}

function sendMsg(){
var input=document.getElementById('chatInput');
var msg=input.value.trim();
if(!msg) return;
if(!countryChats[currentCountry]) countryChats[currentCountry]=[];
countryChats[currentCountry].push({user:"You - Swat",msg:msg});
loadChat(currentCountry);
input.value="";
}

map.on('click',function(e){showRandomTap(e.latlng);});
function nextTap(){showRandomTap();}
function likeTap(){var b=document.getElementById('heartBtn');b.style.color=b.style.color=='rgb(255, 23, 68)'?'#444':'#ff1744';}
function uploadTap(){var n={lat:34.8+Math.random(),lng:72.3+Math.random(),place:"You - Swat, Pakistan",country:"Pakistan",flag:"🇵🇰",img:"https://picsum.photos/500/300?random="+Math.floor(Math.random()*100),time:"Just now"};taps.unshift(n);showRandomTap(n);}
setTimeout(()=>{showRandomTap();},1000);
</script>
</body>
</html>
