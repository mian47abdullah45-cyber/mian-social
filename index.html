<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Tap - Tap The World</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Arial;overflow:hidden}
#map{height:100vh;width:100vw;z-index:1}
.top-bar{position:fixed;top:0;left:0;right:0;z-index:999;background:rgba(0,0,0,0.85);padding:12px 15px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222}
.logo{font-weight:900;font-size:22px;letter-spacing:1px}
.logo span{color:#fff}.logo b{color:#888}
.live-count{background:#fff;color:#000;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:bold}
.tap-card{position:fixed;bottom:20px;left:10px;right:10px;z-index:1000;background:#111;border:1px solid #333;border-radius:20px;padding:15px;display:none;max-height:75vh}
.tap-card.show{display:block}
.tap-img{width:100%;height:220px;object-fit:cover;border-radius:15px;background:#222}
.tap-info{display:flex;justify-content:space-between;margin-top:12px;align-items:center}
.tap-place{font-size:16px;font-weight:bold}
.tap-time{font-size:12px;color:#888}
.actions{display:flex;gap:10px;margin-top:12px}
.btn{flex:1;padding:12px;border-radius:25px;border:none;font-weight:bold;cursor:pointer}
.btn-stay{background:#fff;color:#000}
.btn-next{background:#222;color:#fff;border:1px solid #444}
.heart-btn{background:transparent;border:none;font-size:28px;cursor:pointer;color:#444}
.heart-btn.liked{color:#ff1744}
.upload-btn{position:fixed;bottom:90px;right:20px;z-index:999;background:#fff;color:#000;width:60px;height:60px;border-radius:50%;border:none;font-size:28px;font-weight:bold;cursor:pointer;box-shadow:0 4px 20px rgba(255,255,255,0.3)}
</style>
</head>
<body>

<div class="top-bar">
<div class="logo"><span>WORLD</span> <b>TAP</b></div>
<div class="live-count">● <span id="liveNum">1,247</span> LIVE NOW</div>
</div>

<div id="map"></div>

<button class="upload-btn" onclick="uploadTap()">+</button>

<div class="tap-card" id="tapCard">
<img id="tapImg" class="tap-img" src="">
<div class="tap-info">
<div>
<div class="tap-place" id="tapPlace">Swat, Pakistan</div>
<div class="tap-time" id="tapTime">7 sec ago • Tap to see more</div>
</div>
<button class="heart-btn" id="heartBtn" onclick="likeTap()">♥</button>
</div>
<div class="actions">
<button class="btn btn-stay" onclick="stayHere()">STAY & CHAT</button>
<button class="btn btn-next" onclick="nextTap()">NEXT WORLD →</button>
</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// MAP SETUP - Black & White Style
var map = L.map('map', {zoomControl:false, minZoom:2}).setView([30, 70], 3);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);

var taps = [
{lat:34.0,lng:72.0,place:"Khwazakhela, Pakistan",img:"https://images.unsplash.com/photo-1516900448136-be1a5fbeb72e?w=500",time:"5 sec ago"},
{lat:35.9,lng:74.3,place:"Gilgit, Pakistan",img:"https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=500",time:"12 sec ago"},
{lat:24.8,lng:67.0,place:"Karachi, Pakistan",img:"https://images.unsplash.com/photo-1533105079780-92b9be482077?w=500",time:"7 sec ago"},
{lat:40.7,lng:-74.0,place:"New York, USA",img:"https://images.unsplash.com/photo-1496442226666-8d4d0e62e6e9?w=500",time:"3 sec ago"},
{lat:35.6,lng:139.6,place:"Tokyo, Japan",img:"https://images.unsplash.com/photo-1540959733332-eab4deabeeaf?w=500",time:"9 sec ago"},
{lat:51.5,lng:-0.12,place:"London, UK",img:"https://images.unsplash.com/photo-1513635269975-59663e0ac1ad?w=500",time:"15 sec ago"},
{lat:-33.8,lng:151.2,place:"Sydney, Australia",img:"https://images.unsplash.com/photo-1523428096881-5bd79d043006?w=500",time:"20 sec ago"},
{lat:19.0,lng:72.8,place:"Mumbai, India",img:"https://images.unsplash.com/photo-1529253355930-ddbe423a2ac7?w=500",time:"6 sec ago"}
];

function showRandomTap(latlng){
var t = taps[Math.floor(Math.random()*taps.length)];
if(latlng){t.place = "Near You"; t.lat=latlng.lat; t.lng=latlng.lng;}
document.getElementById('tapImg').src=t.img;
document.getElementById('tapPlace').innerText=t.place;
document.getElementById('tapTime').innerText=t.time;
document.getElementById('tapCard').classList.add('show');
document.getElementById('heartBtn').classList.remove('liked');
map.flyTo([t.lat,t.lng],5);
}

map.on('click', function(e){ showRandomTap(e.latlng); });

function nextTap(){ showRandomTap(); }
function stayHere(){ alert('Chat Feature - Coming Soon! User se baat kar sakte ho. Is feature se log ghanto time spend karenge!'); }
function likeTap(){
var btn=document.getElementById('heartBtn');
btn.classList.toggle('liked');
if(btn.classList.contains('liked')){btn.style.color='#ff1744';} else {btn.style.color='#444';}
}
function uploadTap(){
var url = prompt('Apni 7 sec ki photo ka Link dalo (Unsplash se) ya OK dabao demo ke liye:');
if(url!==null){
var newTap = {lat:34.0+Math.random(),lng:72.0+Math.random(),place:"You - Khwazakhela",img:url||"https://images.unsplash.com/photo-1516900448136-be1a5fbeb72e?w=500",time:"Just now"};
taps.unshift(newTap);
showRandomTap(newTap);
alert('Wah Mian! Aapka Tap Live Ho Gaya! Ab puri dunia aapko dekhegi!');
}
}

// Auto show first tap after 2 sec
setTimeout(()=>{showRandomTap();},1500);
// Live counter animation
setInterval(()=>{document.getElementById('liveNum').innerText = Math.floor(1200+Math.random()*500).toLocaleString();},3000);
</script>
</body>
</html>
