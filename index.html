<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>World Tap - Swat</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Arial;overflow:hidden;height:100vh}
#map{height:calc(100vh - 120px);width:100vw;z-index:1;filter:invert(1) hue-rotate(180deg) brightness(0.8) contrast(1.2);}
.top-bar{position:fixed;top:0;left:0;right:0;z-index:999;background:rgba(0,0,0,0.95);padding:10px 15px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222}
.logo{font-weight:900;font-size:18px;line-height:1}
.logo span{font-size:8px;color:#888;display:block;letter-spacing:0.8px}
.page{display:none;height:calc(100vh - 60px);overflow:auto;padding-top:50px;padding-bottom:70px}
.page.active{display:block}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:9999;background:#000;border-top:1px solid #222;display:flex;justify-content:space-around;padding:8px 0 12px 0}
.nav-item{flex:1;text-align:center;color:#666;font-size:10px;cursor:pointer;transition:0.2s}
.nav-item.active{color:#fff}
.nav-item b{font-size:22px;display:block}
.tap-card{position:fixed;bottom:80px;left:10px;right:10px;z-index:1000;background:#111;border:1px solid #333;border-radius:20px;padding:12px;display:none}
.tap-card.show{display:block}
.creator-badge{position:fixed;bottom:85px;left:10px;z-index:998;background:rgba(255,255,255,0.1);padding:5px 10px;border-radius:20px;font-size:9px;color:#aaa}
/* Shorts Page */
.shorts-container{scroll-snap-type:y mandatory;height:calc(100vh - 110px);overflow-y:scroll}
.short-item{scroll-snap-align:start;height:calc(100vh - 110px);position:relative;background:#111;display:flex;align-items:center;justify-content:center;border-bottom:1px solid #222}
.short-item img{width:100%;height:100%;object-fit:cover}
.short-info{position:absolute;bottom:20px;left:15px;right:70px}
.short-actions{position:absolute;right:15px;bottom:80px;display:flex;flex-direction:column;gap:20px;text-align:center}
.action-btn{font-size:28px;line-height:1}
.action-btn span{font-size:11px;display:block;margin-top:4px}
/* Messages */
.msg-item{padding:15px;border-bottom:1px solid #111;display:flex;gap:12px;align-items:center}
.msg-item img{width:50px;height:50px;border-radius:50%}
.msg-item .dot{width:10px;height:10px;background:#0f0;border-radius:50%;margin-left:auto}
/* Profile */
.profile-header{text-align:center;padding:30px 20px}
.profile-header img{width:90px;height:90px;border-radius:50%;border:3px solid #fff}
.google-btn{background:#fff;color:#000;padding:14px 20px;border-radius:30px;border:none;font-weight:bold;width:90%;margin:20px auto;display:flex;align-items:center;justify-content:center;gap:10px;font-size:15px}
.stat-row{display:flex;justify-content:space-around;padding:20px;border-top:1px solid #111;border-bottom:1px solid #111;margin-top:10px}
</style>
</head>
<body>

<div class="top-bar">
<div class="logo">WORLD TAP <span>Sode Pede Main Abdullah Gulzar • Swat 🏔️</span></div>
<div style="font-size:11px;background:#fff;color:#000;padding:4px 10px;border-radius:15px;font-weight:bold">● <span id="liveNum">2,104</span> LIVE</div>
</div>

<!-- PAGE 1: MAP -->
<div id="page-map" class="page active">
<div id="map"></div>
<div class="creator-badge">🏔️ Swat - Abdullah Gulzar</div>
<div class="tap-card" id="tapCard">
<span id="countryTag" style="background:#fff;color:#000;padding:3px 8px;border-radius:10px;font-size:10px;font-weight:bold">🇵🇰 PAKISTAN CHAT</span>
<img id="tapImg" style="width:100%;height:150px;object-fit:cover;border-radius:12px;margin-top:8px" src="">
<div style="display:flex;justify-content:space-between;margin-top:8px"><b id="tapPlace">Swat, Pakistan</b><span id="tapTime" style="font-size:11px;color:#888">Just now</span></div>
<button onclick="document.getElementById('tapCard').classList.remove('show')" style="width:100%;margin-top:10px;padding:10px;border-radius:20px;border:none;background:#fff;color:#000;font-weight:bold">CLOSE & EXPLORE</button>
</div>
</div>

<!-- PAGE 2: SHORT VIDEOS / LOGO -->
<div id="page-shorts" class="page">
<div class="shorts-container" id="shortsContainer"></div>
</div>

<!-- PAGE 3: MESSAGES -->
<div id="page-messages" class="page" style="padding:15px;padding-top:60px">
<h2 style="margin-bottom:15px">Messages 💬</h2>
<div id="msgList">
