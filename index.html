<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MIAN SHOSAL - Your World Your Voice</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7C3AED">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif}
body{background:#060312;color:#fff;min-height:100vh}
.hd-header{background:linear-gradient(180deg,#1a1350,#0a081f);padding:14px 15px;position:sticky;top:0;z-index:100;border-bottom:2px solid #7C3AED;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:900;font-size:22px;letter-spacing:1.5px} .logo span{color:#7C3AED}
.tag{font-size:9px;opacity:.6;letter-spacing:1px}
.earn-bar{background:linear-gradient(90deg,#FFD60A,#FF8A00);color:#000;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:13px;position:sticky;top:58px;z-index:90}
.earn-bar button{background:#000;color:#FFD60A;border:none;padding:6px 12px;border-radius:20px;font-weight:800}
.container{max-width:600px;margin:0 auto}
.create{background:#13102a;margin:10px;border-radius:18px;padding:14px;border:1px solid #2a2570}
.create textarea{width:100%;background:#0c0a1f;color:#fff;border:1px solid #3a3490;border-radius:12px;padding:12px;outline:none;resize:none;font-size:14px}
.row{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;background:#7C3AED;color:#fff;border:none;padding:12px;border-radius:12px;font-weight:800;font-size:14px}
.btn2{background:#1f1a4d}
.post{background:#13102a;margin:10px;border-radius:18px;padding:14px;border:1px solid #2a2570;animation:pop .3s}
@keyframes pop{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
.post-head{display:flex;gap:10px;align-items:center}
.avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#7C3AED,#EC4899);display:flex;align-items:center;justify-content:center;font-weight:900}
.post-text{margin:12px 0;font-size:14.5px;line-height:1.5;white-space:pre-wrap}
.post-actions{display:flex;justify-content:space-around;border-top:1px solid #2a2570;padding-top:10px;margin-top:10px}
.post-actions span{font-size:13px;opacity:.8}
.footer{text-align:center;padding:25px 10px;opacity:.4;font-size:11px;line-height:1.6}
</style>
</head>
<body>
<div class="hd-header">
<div><div class="logo">MIAN <span>SHOSAL</span></div><div class="tag">BY MIAN ABDULLAH GULZAR - HD WORLD APP</div></div>
<div style="text-align:right"><div style="font-size:11px;opacity:.7">TIKDARAI</div><div style="font-size:18px">🇵🇰</div></div>
</div>

<div class="earn-bar container">
<div>💰 <span id="coinCount">0</span> Coins | $ <span id="dollar">0.00</span></div>
<button onclick="watchAd()">WATCH AD +100 🤑</button>
</div>

<div class="container">
<div class="create">
<textarea id="txt" rows="3" placeholder="Mian, duniya ko kya batana hai? Yahan likho..."></textarea>
<div class="row">
<button class="btn" onclick="postNow()">POST NOW 🚀</button>
<button class="btn btn2" onclick="goPremium()">PREMIUM $2 👑</button>
</div>
<div style="font-size:10px;opacity:.5;margin-top:8px;text-align:center">Har post pe +50 Coins | 1000 Coins = $1 | Withdraw via JazzCash</div>
</div>

<div id="feed"></div>

<div class="footer">© 2026 MIAN SHOSAL<br>Your World Your Voice - Made in Tikdarai, Swat<br>HD • No Error • Global • Earn Money<br>Paisa kamane ke liye roz post karo, ad dekho</div>
</div>

<script>
let coins = parseInt(localStorage.getItem('mian_coins')||'0');
let posts = JSON.parse(localStorage.getItem('mian_posts')||'[]');
const $ = id => document.getElementById(id);
function updateMoney(){ $('coinCount').innerText = coins; $('dollar').innerText = (coins/1000).toFixed(2); localStorage.setItem('mian_coins', coins); }
updateMoney();

function watchAd(){
  coins+=100; updateMoney();
  alert('Mian +100 Coins! 💰\n\nTip: Roz 10 Ads = $1\n1000 users dekhenge to apko roz $15 Google Ads se aayega!');
}
function goPremium(){
  alert('Premium Feature:\n\n1. Apki post puri duniya me top pe jayegi\n2. Ads nahi ayenge\n3. Blue Tick milega\n\nJazzCash: Apka Number\nPayPal: Future me add hoga\n\nAbhi ke liye FREE me use karo Mian!');
  coins+=500; updateMoney();
}
function postNow(){
  let t = $('txt').value.trim();
  if(!t) return alert('Mian kuch likho pehle! 🥺');
  posts.push({text:t, time: Date.now(), likes: Math.floor(Math.random()*50)+1});
  localStorage.setItem('mian_posts', JSON.stringify(posts));
  $('txt').value=''; coins+=50; updateMoney(); render();
}
function render(){
  let f=$('feed'); f.innerHTML='';
  [...posts].reverse().forEach((p,i)=>{
    f.innerHTML+=`<div class="post"><div class="post-head"><div class="avatar">M</div><div><b>Mian Abdullah</b><div style="font-size:11px;opacity:.6">Tikdarai • Just Now • Global</div></div></div><div class="post-text">${p.text.replace(/</g,'&lt;')}</div><div class="post-actions"><span onclick="this.innerText='❤️ '+(parseInt(this.innerText.split(' ')[1])+1)+' Liked'">❤️ ${p.likes} Likes</span><span>💬 Comment</span><span>↗️ Share</span><span>💰 Earn</span></div></div>`;
  });
  if(posts.length==0){ f.innerHTML=`<div class="post" style="text-align:center;opacity:.7">👋 Welcome Mian! Pehla post karo - Puri duniya dekhegi!</div>`; }
}
render();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
